[project]
name = "covariance-shrinkage"
version = "0.1.0"
description = "Covariance shrinkage for minimum-variance portfolios: sample covariance and linear shrinkage, out of sample"
authors = [
    {name = "Felix Hensel"}
]
requires-python = ">=3.13,<3.15"
dependencies = [
    "numpy (>=2.0)",
    "pandas (>=2.2)",
    "scipy (>=1.13)",
]

[tool.poetry]
packages = [{ include = "covariance_shrinkage" }]

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0.0,<9.0.0"
scikit-learn = ">=1.5"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q --tb=short"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
